
services:

  osm-tile-server-import:
    container_name: osm-tile-server-import
    image: openstreetmap-tile-server:latest # local build
#    image: overv/openstreetmap-tile-server:latest
    volumes:
    - type: bind
      source: osm-data
      target: /data/database
    - type: bind
      source: ../openstreetmap-carto
#      source: osm-style
      target: /data/style
    - type: bind
      source: download/fuerth.osm.pbf
#      source: download/mittelfranken-latest.osm.pbf
      target: /data/region.osm.pbf
      read_only: true
    - type: bind
      source: download/fuerth.poly
#      source: download/mittelfranken.poly
      target: /data/region.poly
      read_only: true
    environment:
#      DOWNLOAD_PBF: https://download.geofabrik.de/europe/germany/bayern/mittelfranken-latest.osm.pbf
#      DOWNLOAD_POLY: https://download.geofabrik.de/europe/germany/bayern/mittelfranken.poly
      UPDATES: disabled
#      UPDATES: enabled
#      REPLICATION_URL: https://download.geofabrik.de/europe/germany/bayern/mittelfranken-updates
#      MAX_INTERVAL_SECONDS: 3600
    command: "import"

  osm-tile-server-run:
    container_name: osm-tile-server-run
    image: openstreetmap-tile-server:latest # local build
#    image: overv/openstreetmap-tile-server:latest
    volumes:
    - type: bind
      source: osm-data
      target: /data/database
    - type: bind
      source: ../openstreetmap-carto
#      source: osm-style
      target: /data/style
    - type: bind
      source: osm-tiles
      target: /data/tiles
    environment:
      UPDATES: disabled
#      UPDATES: enabled
#      REPLICATION_URL: https://download.geofabrik.de/europe/germany/bayern/mittelfranken-updates
#      MAX_INTERVAL_SECONDS: 3600
#      THREADS: 12
    ports:
    - 80:80
    depends_on:
      osm-tile-server-import:
        condition: service_completed_successfully
    command: "run"
